name: Build AAB for Google Play

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Grant Execute Permission for Gradlew
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
          elif [ -f "./MehranAndroid/gradlew" ]; then
            chmod +x ./MehranAndroid/gradlew
          fi

      - name: Generate Keystore & Build Release Bundle
        run: |
          if [ -d "./MehranAndroid" ]; then cd ./MehranAndroid; fi
          
          keytool -genkey -v -keystore release.jks -alias mehran_key -keyalg RSA -keysize 2048 -validity 10000 -storepass mehran123 -keypass mehran123 -dname "CN=Mehran, OU=Game, O=Dev, L=Baghdad, S=Baghdad, C=IQ"

          ./gradlew bundleRelease \
            -Pandroid.injected.signing.store.file=$(pwd)/release.jks \
            -Pandroid.injected.signing.store.password=mehran123 \
            -Pandroid.injected.signing.key.alias=mehran_key \
            -Pandroid.injected.signing.key.password=mehran123

      - name: Upload AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mehran-Release-AAB
          path: '**/build/outputs/bundle/release/*.aab'

      - name: Upload Keystore (Keep this safe!)
        uses: actions/upload-artifact@v4
        with:
          name: Mehran-Keystore
          path: '**/release.jks'
