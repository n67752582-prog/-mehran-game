name: Build AAB for Google Play

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Extract Project Files
        run: |
          find . -name "*.zip" -exec unzip -o {} \;

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle and Build AAB
        run: |
          PROJECT_ROOT=$(dirname $(find . -name "build.gradle" | head -n 1))
          cd "$PROJECT_ROOT"
          
          gradle wrapper
          chmod +x gradlew

          keytool -genkey -v -keystore release.jks -alias mehran_key -keyalg RSA -keysize 2048 -validity 10000 -storepass mehran123 -keypass mehran123 -dname "CN=Mehran, OU=Game, O=Dev, L=Baghdad, S=Baghdad, C=IQ"

          ./gradlew bundleRelease \
            -Pandroid.injected.signing.store.file=$(pwd)/release.jks \
            -Pandroid.injected.signing.store.password=mehran123 \
            -Pandroid.injected.signing.key.alias=mehran_key \
            -Pandroid.injected.signing.key.password=mehran123

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: Mehran-Release-AAB
          path: '**/build/outputs/bundle/release/*.aab'

      - name: Upload Keystore
        uses: actions/upload-artifact@v4
        with:
          name: Mehran-Keystore
          path: '**/release.jks'
